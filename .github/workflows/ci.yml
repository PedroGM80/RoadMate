name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # The :app build's preBuild task downloads the ~39 MB Vosk model into
      # assets (onlyIf it's missing). Cache it so CI doesn't re-fetch from
      # alphacephei.com every run and doesn't go red if that host is down.
      - name: Cache Vosk model
        uses: actions/cache@v5
        with:
          path: app/src/main/assets/vosk-model-small-es-0.42.zip
          key: vosk-model-small-es-0.42

      - name: Unit tests (:domain + :app)
        run: ./gradlew :domain:test :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      # Android Lint sees a class of defect the unit tests structurally
      # cannot: leaked Cursors and AudioRecords, foreground-service type
      # mismatches, permission calls without a check, Compose effects doing
      # the wrong thing. `checkDependencies = true` in :app covers :data and
      # :domain too. Non-gating for now (lint { abortOnError = false }) —
      # read the report, then tighten it.
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
