androidx-car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
# Host-side test doubles for Car App Library screens (TestCarContext,
# SessionController, ScreenController). androidTest only.
androidx-car-app-testing = { group = "androidx.car.app", name = "app-testing", version.ref = "carApp" }
# Host-side implementation of the Android Auto (projected) APIs. Without it
# CarAudioRecord.create() throws "CarAudioRecord not configured": the `app`
# artifact ships only the API, not the transport to the projected host.
androidx-car-app-projected = { group = "androidx.car.app", name = "app-projected", version.ref = "carApp" }
